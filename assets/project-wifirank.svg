<svg xmlns="http://www.w3.org/2000/svg" width="590" height="290" viewBox="0 0 590 290" role="img" aria-label="WifiRank: Crowdsourced speed tests and reviews for Dhaka ISPs, run on a live map and ranked per neighbourhood."><style>
.s{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.tb{transform-box:fill-box;transform-origin:center}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.78);opacity:.25}}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
@keyframes wave{0%,70%,100%{opacity:.35;transform:scale(1)}12%{opacity:1;transform:scale(1.9)}}
@keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
.f{animation:fade 1s cubic-bezier(.22,1,.36,1) both}
.p{animation:pulse 3.6s ease-in-out infinite}
.b{animation:blink 1.1s step-end infinite}
.dr{stroke-dasharray:1200;animation:draw 2.6s cubic-bezier(.22,1,.36,1) both}
.w{transform-box:fill-box;transform-origin:left;animation:wipe 1.4s cubic-bezier(.22,1,.36,1) both}
.fl{animation:float 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shadow 4.8s ease-in-out infinite}
.rp{transform-box:fill-box;transform-origin:center;animation:ripple 2.4s cubic-bezier(.22,1,.36,1) infinite}
.wv{transform-box:fill-box;transform-origin:center;animation:wave 6s ease-in-out infinite}
.sw{animation:sweep 9s linear infinite}
.g{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.22,1,.36,1) both,bob 5s ease-in-out 1.4s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="590" height="290" rx="14" fill="#000000"/><rect x=".5" y=".5" width="589" height="289" rx="13.5" fill="none" stroke="#3b3936"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cc"><rect width="590" height="290" rx="14"/></clipPath></defs><g clip-path="url(#cc)"><rect class="sw" style="animation-delay:5s" x="0" y="0" width="260" height="290" fill="url(#sg)" transform="skewX(-18)"/></g><path class="dr" d="M436 96 Q498 10 558 84" fill="none" stroke="#3b3936" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="-3" y="-3" width="6" height="6" fill="#897aff"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M436 96 Q498 10 558 84" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"/></rect><rect x="-3" y="-3" width="6" height="6" fill="#897aff"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M436 96 Q498 10 558 84" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"/></rect><rect x="-3" y="-3" width="6" height="6" fill="#897aff"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M436 96 Q498 10 558 84" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"/></rect><rect x="431" y="91" width="10" height="10" fill="#ffffff"/><circle class="rp" cx="558" cy="84" r="6" fill="none" stroke="#897aff"/><rect x="553" y="79" width="10" height="10" fill="#897aff"/><text class="m" x="32" y="44" font-size="15" letter-spacing="1.4" fill="#aaa59e" text-anchor="start">PERSONAL · LIVE</text><text class="s" x="32" y="84" font-size="30" font-weight="700" fill="#ffffff">WifiRank</text><g class="f" style="animation-delay:0s"><text class="s" x="32" y="118.0" font-size="19" fill="#aaa59e">Crowdsourced speed tests and reviews</text><text class="s" x="32" y="145.6" font-size="19" fill="#aaa59e">for Dhaka ISPs, run on a live map and</text><text class="s" x="32" y="173.1" font-size="19" fill="#aaa59e">ranked per neighbourhood.</text></g><line class="w" style="animation-delay:.3s" x1="32" y1="232" x2="558" y2="232" stroke="#3b3936"/><text class="m" x="32" y="266" font-size="15" fill="#aaa59e">Astro · React · Neon · MapLibre</text><text class="m" x="558" y="266" font-size="15" fill="#897aff" text-anchor="end">wifirank.site</text></svg>
