<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Co-founder &amp; Operations Director at Arché Intelligence Lab"><style>
.s{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.tb{transform-box:fill-box;transform-origin:center}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.78);opacity:.25}}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
@keyframes wave{0%,70%,100%{opacity:.35;transform:scale(1)}12%{opacity:1;transform:scale(1.9)}}
@keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
.f{animation:fade 1s cubic-bezier(.22,1,.36,1) both}
.p{animation:pulse 3.6s ease-in-out infinite}
.b{animation:blink 1.1s step-end infinite}
.dr{stroke-dasharray:1200;animation:draw 2.6s cubic-bezier(.22,1,.36,1) both}
.w{transform-box:fill-box;transform-origin:left;animation:wipe 1.4s cubic-bezier(.22,1,.36,1) both}
.fl{animation:float 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shadow 4.8s ease-in-out infinite}
.rp{transform-box:fill-box;transform-origin:center;animation:ripple 2.4s cubic-bezier(.22,1,.36,1) infinite}
.wv{transform-box:fill-box;transform-origin:center;animation:wave 6s ease-in-out infinite}
.sw{animation:sweep 9s linear infinite}
.g{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.22,1,.36,1) both,bob 5s ease-in-out 1.4s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="1200" height="450" rx="14" fill="#0a0a0a"/><rect x=".5" y=".5" width="1199" height="449" rx="13.5" fill="none" stroke="#3b3936"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cc"><rect width="1200" height="450" rx="14"/></clipPath></defs><g clip-path="url(#cc)"><rect class="sw" style="animation-delay:4s" x="0" y="0" width="260" height="450" fill="url(#sg)" transform="skewX(-18)"/></g><text class="m" x="48" y="56" font-size="15" letter-spacing="1.4" fill="#aaa59e" text-anchor="start">MAY 2024 – NOW</text><text class="s" x="48" y="100" font-size="34" font-weight="700" fill="#ffffff">Arché Intelligence Lab</text><text class="s" x="48" y="130" font-size="20" fill="#aaa59e">Co-founder &amp; Operations Director</text><line class="w" x1="48" y1="156" x2="1152" y2="156" stroke="#3b3936"/><line class="w" style="animation-delay:.2s" x1="48" y1="156" x2="128" y2="156" stroke="#897aff" stroke-width="2"/><text class="m" x="1152" y="56" font-size="17" fill="#897aff" text-anchor="end">archelab.org ↗</text><rect x="50" y="184" width="7" height="7" fill="#aaa59e"/><g class="f" style="animation-delay:0.1s"><text class="s" x="70" y="196.0" font-size="20" fill="#ffffff">Co-founded a non-profit, student-led AI research lab with collaborators across four countries.</text></g><rect x="50" y="227.0" width="7" height="7" fill="#aaa59e"/><g class="f" style="animation-delay:0.2s"><text class="s" x="70" y="239.0" font-size="20" fill="#ffffff">Supervise the Computer Vision &amp; Medical-AI track: brain MRI, ophthalmic imaging, skin lesions,</text><text class="s" x="70" y="268.0" font-size="20" fill="#ffffff">federated and explainable diagnosis.</text></g><rect x="50" y="299.0" width="7" height="7" fill="#aaa59e"/><g class="f" style="animation-delay:0.30000000000000004s"><text class="s" x="70" y="311.0" font-size="20" fill="#ffffff">Mentor student researchers from first idea to peer-reviewed paper.</text></g><rect x="50" y="342.0" width="7" height="7" fill="#aaa59e"/><g class="f" style="animation-delay:0.4s"><text class="s" x="70" y="354.0" font-size="20" fill="#ffffff">The lab has grown to 24 peer-reviewed publications across medical imaging, explainable AI and</text><text class="s" x="70" y="383.0" font-size="20" fill="#ffffff">Bengali NLP.</text></g></svg>
