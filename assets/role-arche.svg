<svg xmlns="http://www.w3.org/2000/svg" width="590" height="400" viewBox="0 0 590 400" role="img" aria-label="Co-founder &amp; Operations Director at Arché Intelligence Lab"><style>
.s{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.tb{transform-box:fill-box;transform-origin:center}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.78);opacity:.25}}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
@keyframes wave{0%,70%,100%{opacity:.35;transform:scale(1)}12%{opacity:1;transform:scale(1.9)}}
@keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
.f{animation:fade 1s cubic-bezier(.22,1,.36,1) both}
.p{animation:pulse 3.6s ease-in-out infinite}
.b{animation:blink 1.1s step-end infinite}
.dr{stroke-dasharray:1200;animation:draw 2.6s cubic-bezier(.22,1,.36,1) both}
.w{transform-box:fill-box;transform-origin:left;animation:wipe 1.4s cubic-bezier(.22,1,.36,1) both}
.fl{animation:float 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shadow 4.8s ease-in-out infinite}
.rp{transform-box:fill-box;transform-origin:center;animation:ripple 2.4s cubic-bezier(.22,1,.36,1) infinite}
.wv{transform-box:fill-box;transform-origin:center;animation:wave 6s ease-in-out infinite}
.sw{animation:sweep 9s linear infinite}
.g{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.22,1,.36,1) both,bob 5s ease-in-out 1.4s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="590" height="400" rx="14" fill="#000000"/><rect x=".5" y=".5" width="589" height="399" rx="13.5" fill="none" stroke="#3b3936"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cc"><rect width="590" height="400" rx="14"/></clipPath></defs><g clip-path="url(#cc)"><rect class="sw" style="animation-delay:4s" x="0" y="0" width="260" height="400" fill="url(#sg)" transform="skewX(-18)"/></g><text class="m" x="32" y="44" font-size="11" letter-spacing="1.2" fill="#aaa59e" text-anchor="start">MAY 2024 – NOW</text><text class="s" x="32" y="80" font-size="24" font-weight="700" fill="#ffffff">Arché Intelligence Lab</text><text class="s" x="32" y="104" font-size="14" fill="#aaa59e">Co-founder &amp; Operations Director</text><line class="w" x1="32" y1="124" x2="558" y2="124" stroke="#3b3936"/><line class="w" style="animation-delay:.2s" x1="32" y1="124" x2="96" y2="124" stroke="#897aff" stroke-width="2"/><rect x="34" y="143" width="5" height="5" fill="#aaa59e"/><g class="f" style="animation-delay:0.1s"><text class="s" x="50" y="152.0" font-size="14" fill="#ffffff">Co-founded a non-profit, student-led AI research lab with</text><text class="s" x="50" y="172.3" font-size="14" fill="#ffffff">collaborators across four countries.</text></g><rect x="34" y="193.6" width="5" height="5" fill="#aaa59e"/><g class="f" style="animation-delay:0.22s"><text class="s" x="50" y="202.6" font-size="14" fill="#ffffff">Supervise the Computer Vision &amp; Medical-AI track: brain MRI,</text><text class="s" x="50" y="222.9" font-size="14" fill="#ffffff">ophthalmic imaging, skin lesions, federated and explainable</text><text class="s" x="50" y="243.2" font-size="14" fill="#ffffff">diagnosis.</text></g><rect x="34" y="264.5" width="5" height="5" fill="#aaa59e"/><g class="f" style="animation-delay:0.33999999999999997s"><text class="s" x="50" y="273.5" font-size="14" fill="#ffffff">Mentor student researchers from first idea to peer-reviewed paper.</text></g><rect x="34" y="294.8" width="5" height="5" fill="#aaa59e"/><g class="f" style="animation-delay:0.45999999999999996s"><text class="s" x="50" y="303.8" font-size="14" fill="#ffffff">The lab has grown to 24 peer-reviewed publications across medical</text><text class="s" x="50" y="324.1" font-size="14" fill="#ffffff">imaging, explainable AI and Bengali NLP.</text></g><text class="m" x="558" y="44" font-size="11" fill="#897aff" text-anchor="end">archelab.org ↗</text></svg>
