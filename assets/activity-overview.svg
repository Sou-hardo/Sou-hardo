<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="2220 contributions in the last year"><style>
.s{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.tb{transform-box:fill-box;transform-origin:center}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.78);opacity:.25}}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
@keyframes wave{0%,70%,100%{opacity:.35;transform:scale(1)}12%{opacity:1;transform:scale(1.9)}}
@keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
.f{animation:fade 1s cubic-bezier(.22,1,.36,1) both}
.p{animation:pulse 3.6s ease-in-out infinite}
.b{animation:blink 1.1s step-end infinite}
.dr{stroke-dasharray:1200;animation:draw 2.6s cubic-bezier(.22,1,.36,1) both}
.w{transform-box:fill-box;transform-origin:left;animation:wipe 1.4s cubic-bezier(.22,1,.36,1) both}
.fl{animation:float 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shadow 4.8s ease-in-out infinite}
.rp{transform-box:fill-box;transform-origin:center;animation:ripple 2.4s cubic-bezier(.22,1,.36,1) infinite}
.wv{transform-box:fill-box;transform-origin:center;animation:wave 6s ease-in-out infinite}
.sw{animation:sweep 9s linear infinite}
.g{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.22,1,.36,1) both,bob 5s ease-in-out 1.4s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="590" height="300" rx="14" fill="#000000"/><rect x=".5" y=".5" width="589" height="299" rx="13.5" fill="none" stroke="#3b3936"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cc"><rect width="590" height="300" rx="14"/></clipPath></defs><g clip-path="url(#cc)"><rect class="sw" style="animation-delay:2s" x="0" y="0" width="260" height="300" fill="url(#sg)" transform="skewX(-18)"/></g><text class="s" x="32" y="46" font-size="15" font-weight="700" fill="#ffffff">GitHub, last 12 months</text><circle cx="128" cy="160" r="70" fill="none" stroke="#242321" stroke-width="8"/><circle cx="128" cy="160" r="70" fill="none" stroke="#897aff" stroke-width="8" stroke-linecap="round" transform="rotate(-90 128 160)" stroke-dasharray="439.8" stroke-dashoffset="439.8"><animate attributeName="stroke-dashoffset" from="439.8" to="52.8" dur="1.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".22 1 .36 1"/></circle><circle class="p" cx="128" cy="90" r="3" fill="#ffffff"/><text class="s f" x="128" y="166" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2,220</text><text class="s" x="128" y="188" font-size="12" fill="#aaa59e" text-anchor="middle">contributions</text><g class="f" style="animation-delay:0.30s"><text class="s" x="260" y="128" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-.5">2,113</text><text class="m" x="260" y="150" font-size="11" letter-spacing="1.2" fill="#aaa59e" text-anchor="start">COMMITS</text></g><g class="f" style="animation-delay:0.40s"><text class="s" x="420" y="128" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-.5">56</text><text class="m" x="420" y="150" font-size="11" letter-spacing="1.2" fill="#aaa59e" text-anchor="start">PULL REQUESTS</text></g><g class="f" style="animation-delay:0.50s"><text class="s" x="260" y="202" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-.5">44</text><text class="m" x="260" y="224" font-size="11" letter-spacing="1.2" fill="#aaa59e" text-anchor="start">ISSUES</text></g><g class="f" style="animation-delay:0.60s"><text class="s" x="420" y="202" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-.5">9</text><text class="m" x="420" y="224" font-size="11" letter-spacing="1.2" fill="#aaa59e" text-anchor="start">FOLLOWERS</text></g><line class="w" x1="32" y1="254" x2="558" y2="254" stroke="#3b3936"/><text class="m" x="32" y="278" font-size="11" letter-spacing="1.2" fill="#aaa59e" text-anchor="start">STREAK 13 DAYS · LONGEST 16 · BEST DAY 108</text></svg>
