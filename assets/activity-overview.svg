.4" fill="#aaa59e" text-anchor="start">FOLLOWERS</text></g><line class="w" x1="32" y1="284" x2="558" y2="284" stroke="#3b3936"/><text class="m" x="32" y="308" font-size="15" letter-spacing="1.4" fill="#aaa59e" text-anchor="start">STREAK 14D · LONGEST 16D · BEST DAY 108</text></svg>
