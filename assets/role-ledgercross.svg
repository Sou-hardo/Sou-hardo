ont-size="14" fill="#ffffff">APRON: AI procurement negotiator. AI proposes, deterministic code</text><text class="s" x="50" y="273.5" font-size="14" fill="#ffffff">verifies, policy decides, humans approve.</text></g><rect x="34" y="294.8" width="5" height="5" fill="#aaa59e"/><g class="f" style="animation-delay:0.45999999999999996s"><text class="s" x="50" y="303.8" font-size="14" fill="#ffffff">ACROA: contract risk agent with deterministic renewal math and a</text><text class="s" x="50" y="324.1" font-size="14" fill="#ffffff">deny-by-default policy gate.</text></g><rect x="34" y="345.40000000000003" width="5" height="5" fill="#aaa59e"/><g class="f" style="animation-delay:0.58s"><text class="s" x="50" y="354.4" font-size="14" fill="#ffffff">Keptcash: AI accounts-receivable employee that diagnoses unpaid</text><text class="s" x="50" y="374.7" font-size="14" fill="#ffffff">invoices and drafts the follow-up.</text></g><text class="m" x="558" y="44" font-size="11" fill="#897aff" text-anchor="end">ledgercross.com ↗</text></svg>
