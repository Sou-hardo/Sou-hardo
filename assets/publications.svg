36" y="232" font-size="14" fill="#aaa59e" text-anchor="end">ICCIT</text><line class="w" style="animation-delay:0.44s" x1="64" y1="250" x2="1136" y2="250" stroke="#3b3936"/></g><g class="f" style="animation-delay:0.32s"><text class="m" x="64" y="276" font-size="12" fill="#aaa59e">2025</text><text class="s" x="150" y="276" font-size="16" fill="#ffffff">VARENet: variance-aware network for fungal microscopy</text><text class="s" x="1136" y="276" font-size="14" fill="#aaa59e" text-anchor="end">IEEE ICBME</text><line class="w" style="animation-delay:0.52s" x1="64" y1="294" x2="1136" y2="294" stroke="#3b3936"/></g><g class="f" style="animation-delay:0.40s"><text class="m" x="64" y="320" font-size="12" fill="#aaa59e">2024</text><text class="s" x="150" y="320" font-size="16" fill="#ffffff">Brain MRI ND-5 Dataset</text><text class="s" x="1136" y="320" font-size="14" fill="#aaa59e" text-anchor="end">IEEE DataPort</text><line class="w" style="animation-delay:0.60s" x1="64" y1="338" x2="1136" y2="338" stroke="#3b3936"/></g><g class="f" style="animation-delay:0.48s"><text class="m" x="64" y="364" font-size="12" fill="#897aff">Review</text><text class="s" x="150" y="364" font-size="16" fill="#ffffff">Hi-TGNet: hierarchical tumor guidance network (thesis)</text><text class="s" x="1136" y="364" font-size="14" fill="#aaa59e" text-anchor="end">Sci. Reports</text><line class="w" style="animation-delay:0.68s" x1="64" y1="382" x2="1136" y2="382" stroke="#3b3936"/></g></svg>
