36" y="280" font-size="18" fill="#aaa59e" text-anchor="end">TCCE · Springer</text><line class="w" style="animation-delay:0.44s" x1="64" y1="304" x2="1136" y2="304" stroke="#3b3936"/></g><g class="f" style="animation-delay:0.32s"><text class="m" x="64" y="336" font-size="16" fill="#aaa59e">2025</text><text class="s" x="160" y="336" font-size="20" fill="#ffffff">SSChNet: self-supervised network for child speech recognition</text><text class="s" x="1136" y="336" font-size="18" fill="#aaa59e" text-anchor="end">IEEE NCIM</text><line class="w" style="animation-delay:0.52s" x1="64" y1="360" x2="1136" y2="360" stroke="#3b3936"/></g><g class="f" style="animation-delay:0.40s"><text class="m" x="64" y="392" font-size="16" fill="#aaa59e">2024</text><text class="s" x="160" y="392" font-size="20" fill="#ffffff">Brain MRI ND-5 Dataset</text><text class="s" x="1136" y="392" font-size="18" fill="#aaa59e" text-anchor="end">IEEE DataPort</text><line class="w" style="animation-delay:0.60s" x1="64" y1="416" x2="1136" y2="416" stroke="#3b3936"/></g><g class="f" style="animation-delay:0.48s"><text class="m" x="64" y="448" font-size="16" fill="#897aff">Review</text><text class="s" x="160" y="448" font-size="20" fill="#ffffff">Hi-TGNet: hierarchical tumor guidance network (thesis)</text><text class="s" x="1136" y="448" font-size="18" fill="#aaa59e" text-anchor="end">Sci. Reports</text><line class="w" style="animation-delay:0.68s" x1="64" y1="472" x2="1136" y2="472" stroke="#3b3936"/></g></svg>
