name: Update profile SVGs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # STATS_TOKEN must be a classic PAT with the `repo` and `read:org` scopes so
      # the "Now" card and activity charts include private and org repositories.
      - name: Render profile SVGs
        run: python3 scripts/build_svgs.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: update profile SVGs" || exit 0
          git push
